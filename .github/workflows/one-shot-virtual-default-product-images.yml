      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HygiaTrade.Server.sln

      - name: Build
        run: dotnet build HygiaTrade.Server.sln --configuration Release --no-restore

      - name: Docker build
        run: docker build -f Dockerfile .

      - name: Commit backend changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-virtual-default-product-images.yml
          git add HygiaTrade.Server.API/Controllers/ProductsController.cs \
                  HygiaTrade.Server.Common/Responses/Product/ProductResponse.cs \
                  HygiaTrade.Server.Common/Responses/Product/ProductsResponse.cs \
                  HygiaTrade.Server.Data/Migrations/20260827143000_VirtualizeDefaultProductImages.cs
          git commit -m "Virtualize default product images"
          git push
